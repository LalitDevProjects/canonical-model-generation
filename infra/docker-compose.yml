# Local Postgres + pgvector for later increments (substrate/registry -
# Increment 5 concept graph and vector index, Increment 11 artefact
# registry). Not used by Increment 1: no runtime code in this increment
# connects to a database. Per the spec's own tech-stack guidance (Section
# 2.3): "Below roughly 5 million chunks, pgvector is one fewer system to
# operate" - vs. a managed search service or a separate graph database.
#
# Usage once Docker Desktop is running: `docker compose -f infra/docker-compose.yml up -d`
#
# Host port 5433, not 5432: this developer's machine already runs a
# separate, unrelated native PostgreSQL 18 Windows service on 5432 (an
# Increment 5 discovery, not a design choice) - remapping avoids fighting
# over the port rather than touching pre-existing infrastructure this
# project doesn't own.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmgp
      POSTGRES_PASSWORD: cmgp
      POSTGRES_DB: cmgp
    ports:
      - "5433:5432"
    volumes:
      - cmgp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmgp -d cmgp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cmgp-postgres-data:

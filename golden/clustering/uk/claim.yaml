openapi: "3.1.0"
info:
  title: Claims Attributes (UK) - Clustering fixtures
  version: "1.0.0"
  description: >
    Increment 7 planted difficulty: dateOfLoss is one member of the
    synonym triple. metadata.claimDate is one half of the planted
    homonym pair - here it means the date the claim RECORD was created
    in the system, mandatory, a dateTime.
paths: {}
components:
  schemas:
    Claim:
      type: object
      required: [claimId, dateOfLoss, claimant, status, metadata]
      properties:
        claimId:
          type: string
          description: Unique claim identifier.
        dateOfLoss:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}"
          description: Date the loss occurred.
        claimant:
          type: string
          description: Name of the person filing the claim.
        status:
          type: string
          enum: [OPEN, CLOSED]
        metadata:
          type: object
          required: [claimDate, recordedBy, recordedAt]
          properties:
            claimDate:
              type: string
              format: date-time
              pattern: "^\\d{4}$"
              description: Date and time the claim record itself was created in the system.
            recordedBy:
              type: string
              description: The user or system that created the claim record.
            recordedAt:
              type: string
              description: Timestamp of record creation.

# Platform default configuration (Section 15.1). As of Increment 2, the
# relevance section is consumed for real by connectors/relevance.py.
environment: dev

models:
  tiers:
    fast:
      provider: primary
      tier_id: fast-v1
      max_tokens: 8000
      model_id: claude-haiku-4-5-20251001
    high:
      provider: primary
      tier_id: high-v1
      max_tokens: 16000
      model_id: claude-sonnet-5
    critic:
      provider: secondary
      tier_id: critic-v1
      max_tokens: 12000
      # No secondary provider is configured in this PoC (Section 19.2's
      # degraded mode: "Critic runs on the primary provider with a
      # distinct prompt lineage") - model_id intentionally left unset
      # until an adversarial-critic increment actually needs it.
  embedding_tier_id: embed-v1
  embedding_dimensions: 1024

storage:
  postgres_dsn: "postgresql://cmgp:cmgp@localhost:5432/cmgp"
  pgvector_enabled: true
  run_store_path: "run-store"

egress:
  policy_version: 3   # MUST match gate/policy.yaml's own version field - enforced at load time
  fail_mode: closed
  lawful_basis: legitimate-interest
  # PoC placeholder secrets, generated once via `python -c "import secrets;print(secrets.token_hex(32))"`.
  # NOT production key material - see EgressConfig.ledger_signing_key/tokenisation_keys docstrings.
  ledger_signing_key: "d859fd29fedfc1e26b910be871a1e717e65e541150886922f676b9a2929c1f19"
  tokenisation_keys:
    us: "8c73ef80e82c027ec3d562344d23af7fc7f0ec1129f5d60fee96d9cd344ae813"
    uk: "78a499de38f0bba79e9a0a84fec7c8f747f6edfb3e15e52df24ac6a81f0f2a7c"
    eu: "e79c43dbc7494f5ff3190c29c1fc5f02fa27228546b988d0bf7a533116ef1602"

# Pass-1 deterministic relevance filtering (Section 4.2). pass1_keep,
# pass1_drop and domain_tokens.claims are transcribed verbatim from the
# spec's own Section 15.1 example; pass1_weights and contract_media_types
# have no spec-given example and are Increment 2 builder defaults (see
# connectors/relevance.py for the reasoning).
relevance:
  pass1_keep: 0.65
  pass1_drop: 0.20
  domain_tokens:
    claims: [claim, fnol, loss, incident, claimant, settlement, reserve, sinistre]
  pass1_weights:
    path: 0.60
    catalogue: 0.20
    gateway: 0.10
    kind: 0.10
  contract_media_types:
    - application/json
    - application/yaml
    - application/x-yaml
    - application/vnd.oai.openapi
    - application/schema+json
    - application/xml
    - application/vnd.apache.avro+json

# Blocking and similarity scoring (Section 9.2-9.3). type_compatibility
# and abbreviations are transcribed verbatim from the spec's own
# pseudocode. link_threshold/review_band_low are platform defaults; a
# run's own RunManifest.parameters (linkThreshold/reviewBandLow)
# overrides them per run - see algorithms/clustering.py.
#
# weights is NOT the spec's literal 0.20/0.30/0.15/0.20/0.15 - this PoC's
# mock embedding provider (substrate/embedding.py) carries no real
# semantic signal, and the spec's own 0.30 embedding weight makes
# LINK_THRESHOLD structurally unreachable even for a perfect match on
# every other feature (see config/settings.py::ClusteringConfig.weights'
# own description for the full reasoning). A deployment with a real
# embedding model should raise embedding back toward 0.30.
clustering:
  weights:
    lexical: 0.27
    embedding: 0.05
    type: 0.20
    constraints: 0.27
    context: 0.21
  type_compatibility:
    - {a: string, b: string, score: 1.0}
    - {a: date, b: dateTime, score: 0.85}
    - {a: string, b: date, score: 0.55}
    - {a: decimal, b: integer, score: 0.70}
    - {a: string, b: boolean, score: 0.30}
    - {a: object, b: string, score: 0.10}
  abbreviations:
    dt: date
    dttm: dateTime
    amt: amount
    nbr: number
    cd: code
    ind: indicator
    desc: description
    ref: reference
    "no": number
    qty: quantity
    sinistre: claim
    police: policy
  link_threshold: 0.72
  review_band_low: 0.55
  block_top_k: 25
  block_max_size: 40

# Dotted spelling matches the spec's own Section 15.3 flag names; translated
# to snake_case by FeatureFlags.from_dotted (config/settings.py) before
# PlatformSettings is constructed.
feature_flags:
  acord.ingestion.enabled: false
  inference.enabled: true
  critic.secondary_provider: true
  gate.dpo_override.enabled: false
  emission.strict_determinism: true

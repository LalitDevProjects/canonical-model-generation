name: CI

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

  regen-and-diff:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Regenerate Pydantic models from contracts/
        run: python scripts/generate_models.py
      - name: Fail if generated/ drifted from contracts/
        run: |
          if ! git diff --exit-code generated/; then
            echo "::error::generated/ is out of date with contracts/. Run 'python scripts/generate_models.py' and commit the result."
            exit 1
          fi

  typecheck:
    needs: regen-and-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_models.py
      - name: mypy --strict
        run: mypy --strict generated contracts config connectors pipeline parsers algorithms gate substrate agents tools eval mapping emit tests

  test:
    needs: regen-and-diff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cmgp
          POSTGRES_PASSWORD: cmgp
          POSTGRES_DB: cmgp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmgp -d cmgp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_models.py
      - name: pytest with coverage (fail under 85%)
        env:
          CMGP_STORAGE__POSTGRES_DSN: postgresql://cmgp:cmgp@localhost:5432/cmgp
        run: pytest tests/ --cov=generated --cov=contracts --cov=config --cov=connectors --cov=pipeline --cov=parsers --cov=algorithms --cov=gate --cov=substrate --cov=agents --cov=tools --cov=eval --cov=mapping --cov=emit --cov-report=term-missing
